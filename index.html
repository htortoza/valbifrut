<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valbifrut — Tableros</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .wrap { text-align: center; }
    .logo { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #4e7a28; margin-bottom: 8px; }
    h1 { font-size: 22px; font-weight: 700; color: #1a1f2e; margin-bottom: 32px; }
    .cards { display: flex; gap: 16px; }
    a.card { display: block; background: #fff; border: 1px solid #e4e7ec; border-radius: 12px; padding: 32px 40px; text-decoration: none; color: inherit; transition: box-shadow .2s, border-color .2s; }
    a.card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.10); border-color: #4e7a28; }
    .card-icon { font-size: 28px; margin-bottom: 12px; }
    .card-title { font-size: 15px; font-weight: 700; color: #1a1f2e; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: #7a8494; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Valbifrut</div>
    <h1>Tableros de gestión</h1>
    <div class="cards">
      <a class="card" href="Tablero Ventas.html">
        <div class="card-icon">📊</div>
        <div class="card-title">Tablero de Ventas</div>
        <div class="card-sub">Resumen comercial y KPIs</div>
      </a>
      <a class="card" href="Tablero Produccion.html">
        <div class="card-icon">⚙️</div>
        <div class="card-title">Tablero de Producción</div>
        <div class="card-sub">Calibrado, ensacado y partido</div>
      </a>
      <a class="card" href="Tablero Comex.html">
        <div class="card-icon">🚢</div>
        <div class="card-title">Planificación y Comex</div>
        <div class="card-sub">Capacidad, planificación y cargas</div>
      </a>
    </div>
  </div>
</body>
</html>
